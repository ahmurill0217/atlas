# Ontology — Business module.
version: "1.0"
module: business

# Roles are facets of an existing entity type, not separate nodes:
# Acme Corp is ONE Organization with roles [Customer], never two nodes.
roles:
  Customer:
    description: An organization acting as our customer.
    applies_to: [Organization]
  Vendor:
    description: An organization acting as our vendor/supplier.
    applies_to: [Organization]

entities:
  Team:
    description: An internal organizational team.
    identity_fields: [team_key, external_id]
    properties: [canonical_name, description]

  Meeting:
    description: A meeting (a kind of Event).
    parent: Event
    identity_fields: [meeting_external_id, event_external_id]
    properties: [title, start_time, end_time, source_system, meeting_external_id, is_external]

  Product:
    description: A product or business offering.
    identity_fields: [external_id]
    properties: [canonical_name, description]

  Contract:
    description: A formal agreement.
    identity_fields: [contract_number, external_id]
    properties: [name, contract_number, effective_date, expiration_date, status, value, currency]

  Initiative:
    description: A broader strategic initiative that may contain projects.
    identity_fields: [external_id]
    properties: [canonical_name, description]

  ActionItem:
    description: A task someone committed to or was assigned (e.g. from a meeting).
    identity_fields: [action_item_key, external_id]
    properties: [description, status, due_date, source_system, recording_timestamp, playback_url]

  Opportunity:
    description: A sales or business opportunity.
    identity_fields: [external_id]
    properties: [name, stage, value, currency, expected_close_date, external_id]

relations:
  WORKS_ON:
    description: The person or team works on the project or initiative.
    source: [Person, Team]
    target: [Project, Initiative]

  OWNS_PROJECT:
    description: The person or team is accountable for the project.
    source: [Person, Team]
    target: [Project]

  ABOUT:
    description: The document or meeting is about the target.
    source: [Document, Meeting]
    target: [Project, Initiative, Product, Organization, Opportunity]

  CUSTOMER_OF:
    description: The source organization is a customer of the target organization.
    source: [Organization]
    target: [Organization]
    implies_source_role: Customer

  VENDOR_OF:
    description: The source organization is a vendor of the target organization.
    source: [Organization]
    target: [Organization]
    implies_source_role: Vendor

  PART_OF:
    description: The project or team is part of the initiative or organization.
    source: [Project, Team]
    target: [Initiative, Organization]

  BETWEEN:
    description: The contract is between the organizations.
    source: [Contract]
    target: [Organization]
    min_targets_per_source: 2   # checked as a completeness warning, not per edge

  ASSIGNED_TO:
    description: The action item is assigned to the person.
    source: [ActionItem]
    target: [Person]

  ORIGINATED_IN:
    description: The action item was raised in the meeting or document.
    source: [ActionItem]
    target: [Meeting, Document]
    max_targets_per_source: 1

  USES_PRODUCT:
    description: The organization, team or project uses the product.
    source: [Organization, Team, Project]
    target: [Product]
