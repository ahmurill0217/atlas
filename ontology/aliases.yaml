  people: {type: Person}
  employee: {type: Person}
  contact: {type: Person}
  individual: {type: Person}
  company: {type: Organization}
  organization: {type: Organization}
  organisation: {type: Organization}
  firm: {type: Organization}
  business: {type: Organization}
  customer: {type: Organization, role: Customer}
  customer company: {type: Organization, role: Customer}
  client: {type: Organization, role: Customer}
  vendor: {type: Organization, role: Vendor}
  supplier: {type: Organization, role: Vendor}
  document: {type: Document}
  email: {type: Document}
  file: {type: Document}
  memo: {type: Document}
  report: {type: Document}
  project: {type: Project}
  event: {type: Event}
  location: {type: Location}
  office: {type: Location}
  team: {type: Team}
  department: {type: Team}
  meeting: {type: Meeting}
  call: {type: Meeting}
  product: {type: Product}
  offering: {type: Product}
  contract: {type: Contract}
