  MEMBER_OF: [member of, on the team, belongs to]
  MANAGES: [manages, manager of, supervises]
  REPORTS_TO: [reports to]
  ATTENDED: [attended, joined, was present at]
  HAS_PARTICIPANT: [has participant, invited, invitee]
  ORGANIZED_BY: [organized by, hosted by, scheduled by]
  AUTHORED_BY: [authored by, written by, sent by, created by]
  MENTIONS: [mentions, refers to]
  WORKS_ON: [works on, working on, contributes to]
  OWNS_PROJECT: [owns, owner of, leads, accountable for, responsible for, project owner]
  ABOUT: [about, regarding, concerns]
  CUSTOMER_OF: [customer of, client of, buys from]
  VENDOR_OF: [vendor of, supplier to, supplies]
  PART_OF: [part of, belongs to initiative]
  BETWEEN: [between, signed by, party to]
