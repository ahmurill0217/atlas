# Ontology V1.1 — Core module.
# Canonical entity and relation types. Nothing outside this directory may
# define graph schema; extractors may only *propose* against it.
version: "1.1"
module: core

entities:
  Person:
    description: A human being.
    identity_fields: [email, employee_id]
    properties: [canonical_name, first_name, last_name, email, job_title, department]

  Organization:
    description: A company or other organizational entity.
    identity_fields: [domain, external_id]
    properties: [canonical_name, domain, organization_type, is_internal]

  Document:
    description: A source document or content artifact (email, file, memo, report).
    identity_fields: [source_id]
    properties: [title, source_system, source_id, mime_type, created_at, modified_at, uri, checksum]

  Project:
    description: A defined body of work with a business objective.
    identity_fields: [project_key, external_id]
    properties: [canonical_name, status, start_date, end_date, description]

  Event:
    description: Something that happens at a time (generic superclass).
    identity_fields: [event_external_id]
    properties: [name, event_type, start_time, end_time, location, description]

  Location:
    description: A real or virtual organizational location.
    identity_fields: [external_id]
    properties: [canonical_name, address, location_type]

relations:
  WORKS_AT:
    description: The person is employed by / works for the organization.
    source: [Person]
    target: [Organization]

  MEMBER_OF:
    description: The person belongs to the team or organization.
    source: [Person]
    target: [Team, Organization]

  MANAGES:
    description: The person manages the other person or team.
    source: [Person]
    target: [Person, Team]

  REPORTS_TO:
    description: The person reports to the other person.
    source: [Person]
    target: [Person]
    max_targets_per_source: 1   # a second, different manager is a conflict

  ATTENDED:
    description: The person was present at the meeting (evidence of presence, not just invitation).
    source: [Person]
    target: [Meeting]

  HAS_PARTICIPANT:
    description: The event lists the person or organization as a participant (e.g. invited).
    source: [Event]
    target: [Person, Organization]

  ORGANIZED_BY:
    description: The event was organized by the person or organization.
    source: [Event]
    target: [Person, Organization]

  AUTHORED_BY:
    description: The document was written or sent by the person, team or organization.
    source: [Document]
    target: [Person, Team, Organization]

  SENT_TO:
    description: The message was addressed to the person (edge property recipient_type = to | cc | bcc). Added in 1.1.
    source: [Document]
    target: [Person]

  MENTIONS:
    description: The document or meeting refers to the entity.
    source: [Document, Meeting]
    target: ["*"]

  RELATED_TO:
    description: Generic, weak association between business objects.
    source: [Organization, Project, Initiative, Product, Opportunity, Contract]
    target: [Organization, Project, Initiative, Product, Opportunity, Contract]

  ASSOCIATED_WITH:
    description: Generic association used for structured links with no more specific predicate.
    source: ["*"]
    target: ["*"]
