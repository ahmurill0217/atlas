[project]
name = "atlas"
version = "0.1.0"
description = "Atlas: deterministic business knowledge graph (V1) plus the brain_v0 LLM-extraction prototype."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "typer>=0.12",
    "rapidfuzz>=3.9",
    "tiktoken>=0.7",
    "pypdf>=6.16.1",
    "fonttools>=4.66.0",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
    "brain[extraction,llm]",
]

[project.optional-dependencies]
models = [
    "gliner2[local]>=2.0",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
]

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "pytest>=8",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas", "brain_v0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
brain = { path = "../brain", editable = true }
