[project]
name = "atlas"
version = "0.1.0"
description = "Atlas: a deterministic business knowledge graph over email, documents and meetings, with brain for cited retrieval."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "typer>=0.12",
    "pypdf>=6.16.1",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
    "brain[extraction,llm]",
]

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "pytest>=8",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
brain = { path = "../brain", editable = true }
