[project]
name = "brain"
version = "0.1.0"
description = "A small, testable knowledge brain: Postgres + pgvector knowledge graph with provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "typer>=0.12",
    "rapidfuzz>=3.9",
    "tiktoken>=0.7",
    "pypdf>=6.19.0",
    "fonttools>=4.66.0",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "pytest>=8",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
